[project]
name = "mneme"
version = "0.1.0.dev0"
description = "Project memory that lives in a git repo beside the code."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Rodrigo Hammerly", email = "hammerlyrodrigo@gmail.com" }]
requires-python = ">=3.11"
dependencies = []
classifiers = [
    "Environment :: Console",
    "Programming Language :: Python :: 3",
    "Topic :: Software Development :: Version Control :: Git",
]

[project.scripts]
mneme = "mneme.cli:main"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
testpaths = ["tests"]
